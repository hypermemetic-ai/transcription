[workspace]
members = [".", "server"]

[package]
name = "plexus-transcription"
version = "0.1.1"
edition = "2021"
description = "Live audio to text with local models, as Plexus activations a service registers: listen (Input<Bytes> in, partial and final text out) and models list/search/download/config"
license = "MIT"
repository = "https://github.com/hypermemetic-ai/transcription"
keywords = ["plexus", "speech", "transcription", "asr", "rpc"]
categories = ["multimedia::audio"]

[dependencies]
# The plexus 0.8 line, by published version.
# PLEXUS-44: plexus-core, plexus-macros and plexus-client, and every crate
# the activation macro's expansion names, through the one umbrella.
# The library serves nothing itself: no transport, plexus-core as before.
plexus-rpc = { version = "0.8.0", default-features = false, features = ["child-ws"] }

# The engine: sherpa-onnx's own Rust API (k2-fsa), its prebuilt static
# libraries (onnxruntime inside) — no cmake, CPU.
sherpa-onnx = "2.0.1"
# Any rate in, 16 kHz out.
rubato = "0.16"

# The crate's own code uses these (serde and schemars for its own
# types' derives); the macro's expansion reaches its own through plexus-rpc.
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"

# models download: HTTP with Range resume, sha256, .tar.bz2.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
bzip2 = "0.4"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
