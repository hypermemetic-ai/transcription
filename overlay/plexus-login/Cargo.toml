# plexus-login on the plexus 0.8 line, by sibling path — a manifest only.
#
# ../plexus-login (main) declares plexus-core 0.7 from crates.io, and a
# `[patch]` cannot hand a 0.7 requirement the 0.8 checkout (cargo leaves an
# incompatible version unused). Its sources build against 0.8 unchanged, so
# this package compiles them where they are (`lib.path`, the page's
# `include_str!` resolves beside them) with the 0.8 siblings. Nothing is
# copied; it goes the day plexus-login moves to 0.8 (see AGENTS.md).
[package]
name = "plexus-login"
version = "0.2.2"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "../../../plexus-login/src/lib.rs"

[dependencies]
plexus-core = { path = "../../../plexus-core" }
plexus-auth-core = { path = "../../../plexus-auth-core", features = ["adapters"] }
plexus-transport = { path = "../../../plexus-transport", default-features = false }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
jsonrpsee = { version = "0.26", features = ["ws-client"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
ipnet = "2"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
