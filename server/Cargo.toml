[package]
name = "transcription-server"
version = "0.1.0"
edition = "2021"
description = "The transcription library served on its own: a Plexus service named `transcription` behind plexus-login"
license = "MIT"
publish = false

[[bin]]
name = "transcription"
path = "src/main.rs"

[dependencies]
transcription = { package = "plexus-transcription", path = ".." }
plexus-core = "0.8.0"
plexus-transport = { version = "0.7.0", default-features = false }
plexus-auth-core = "0.3.0"
plexus-login = "0.3.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_json = "1"

[dev-dependencies]
plexus-client = { version = "0.8.0", features = ["ws-native"] }
futures = "0.3"
bytes = "1"
tempfile = "3"
hound = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
bzip2 = "0.4"
